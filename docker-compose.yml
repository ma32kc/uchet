services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uchet
      POSTGRES_PASSWORD: uchet
      POSTGRES_DB: uchet
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uchet -d uchet"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://uchet:uchet@postgres:5432/uchet?sslmode=disable
      HTTP_ADDR: ":8080"
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      DATABASE_URL: postgres://uchet:uchet@postgres:5432/uchet?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
